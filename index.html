<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פה חניתי</title>
<meta name="theme-color" content="#1BA672">
<meta name="description" content="שמור את מיקום החנייה בלחיצה אחת">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="פה חניתי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1BA672;
    --green-dark: #158a5d;
    --green-light: #e6f6ef;
    --ink: #1e2430;
    --muted: #8b93a1;
    --card: #ffffff;
    --field: #f2f4f7;
    --bg-top: #eef4fb;
    --bg-bottom: #ffffff;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Rubik', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 36px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon-badge {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(27,166,114,0.28);
    margin-bottom: 14px;
  }
  .icon-badge svg { width: 30px; height: 30px; stroke: white; }
  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  h1 { font-size: 30px; font-weight: 700; margin: 0; }
  .share-btn {
    width: 22px; height: 22px; color: var(--muted);
    background: none; border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .subtitle { color: var(--muted); font-size: 15px; margin: 0 0 26px; text-align: center; }

  .card {
    width: 100%;
    background: var(--card);
    border-radius: 22px;
    padding: 26px 22px 24px;
    box-shadow: 0 20px 45px rgba(30,36,48,0.08);
  }

  .field-row { display: flex; gap: 12px; }
  .field { flex: 1; margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: #667085; margin-bottom: 8px; font-weight: 500; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--field);
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--green);
    background: #fff;
  }
  input::placeholder, textarea::placeholder { color: #9aa2b1; }

  .photo-btn {
    width: 100%;
    border: 1.5px dashed #c9cfda;
    background: transparent;
    border-radius: 12px;
    padding: 13px;
    font-size: 14.5px;
    color: #5b6473;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    margin-bottom: 18px;
    font-family: inherit;
    transition: border-color .15s ease, color .15s ease;
  }
  .photo-btn:hover { border-color: var(--green); color: var(--green-dark); }
  .photo-preview {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 14px;
    display: none;
    max-height: 160px;
    object-fit: cover;
  }
  .photo-remove {
    display: none;
    text-align: center;
    font-size: 13px;
    color: var(--danger);
    background: none;
    border: none;
    cursor: pointer;
    margin: -8px 0 18px;
    width: 100%;
    font-family: inherit;
  }

  .save-btn {
    width: 100%;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(27,166,114,0.30);
    font-family: inherit;
    transition: transform .1s ease, background .15s ease;
  }
  .save-btn:hover { background: var(--green-dark); }
  .save-btn:active { transform: scale(0.98); }
  .save-btn svg { width: 18px; height: 18px; }

  .footnote {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 26px;
    line-height: 1.7;
  }
  .footnote a { color: #5b6473; text-decoration: underline; }

  /* Saved-state view */
  .saved-card {
    display: none;
    width: 100%;
    background: var(--card);
    border-radius: 22px;
    padding: 26px 22px 22px;
    box-shadow: 0 20px 45px rgba(30,36,48,0.08);
    text-align: center;
  }
  .saved-check {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--green-light);
    color: var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .saved-check svg { width: 26px; height: 26px; }
  .saved-title { font-size: 19px; font-weight: 700; margin: 0 0 4px; }
  .saved-time { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .saved-grid {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    text-align: right;
  }
  .saved-item {
    flex: 1;
    background: var(--field);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .saved-item .k { font-size: 12px; color: #8b93a1; margin-bottom: 4px; }
  .saved-item .v { font-size: 17px; font-weight: 600; }
  .saved-note {
    background: var(--field);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: right;
    font-size: 14.5px;
    color: #444b58;
    margin-bottom: 16px;
  }
  .saved-photo {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 16px;
    max-height: 220px;
    object-fit: cover;
  }
  .saved-actions { display: flex; gap: 10px; }
  .btn-secondary, .btn-clear {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .btn-secondary { background: var(--green-light); color: var(--green-dark); }
  .btn-clear { background: #fbeceb; color: var(--danger); }

  .toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 11px 20px;
    border-radius: 30px;
    font-size: 13.5px;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .install-banner {
    display: none;
    width: 100%;
    background: var(--green-light);
    color: var(--green-dark);
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 13.5px;
    margin-bottom: 18px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .install-banner button {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="install-banner" id="installBanner">
    <span>אפשר להתקין את האפליקציה במחשב שלך</span>
    <button id="installBtn">התקן</button>
  </div>

  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 1 0 4 0M15 17a2 2 0 1 0 4 0M5 17l1.5-6.5A2 2 0 0 1 8.4 9h7.2a2 2 0 0 1 1.9 1.5L19 17M5 17H3v-3m16 3h2v-3M3 14l1-4h16l1 4"/></svg>
  </div>
  <div class="title-row">
    <button class="share-btn" id="shareBtn" title="שתף">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
    </button>
    <h1>פה חניתי</h1>
  </div>
  <p class="subtitle">שמור את מיקום החנייה בלחיצה אחת</p>

  <!-- FORM CARD -->
  <div class="card" id="formCard">
    <div class="field-row">
      <div class="field">
        <label>שורה / עמוד</label>
        <input type="text" id="spotInput" placeholder="B12">
      </div>
      <div class="field">
        <label>קומה</label>
        <input type="text" id="levelInput" placeholder="-2">
      </div>
    </div>
    <div class="field">
      <label>הערה (אופציונלי)</label>
      <input type="text" id="noteInput" placeholder="ליד המעלית...">
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
    <button class="photo-btn" id="photoBtn">צלם תמונה של המיקום 📷</button>
    <img class="photo-preview" id="photoPreview">
    <button class="photo-remove" id="photoRemove">הסר תמונה</button>
    <button class="save-btn" id="saveBtn">
      <span id="saveBtnLabel">חניתי כאן</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="saveIcon"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>
    </button>
  </div>

  <!-- SAVED STATE CARD -->
  <div class="saved-card" id="savedCard">
    <div class="saved-check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <p class="saved-title">שמרנו את מקום החנייה</p>
    <p class="saved-time" id="savedTime"></p>
    <div class="saved-grid">
      <div class="saved-item"><div class="k">שורה / עמוד</div><div class="v" id="savedSpot">—</div></div>
      <div class="saved-item"><div class="k">קומה</div><div class="v" id="savedLevel">—</div></div>
    </div>
    <div class="saved-note" id="savedNoteWrap" style="display:none">
      <span id="savedNote"></span>
    </div>
    <img class="saved-photo" id="savedPhoto" style="display:none">
    <div class="saved-actions">
      <button class="btn-secondary" id="editBtn">ערוך</button>
      <button class="btn-clear" id="clearBtn">מצאתי את הרכב</button>
    </div>
  </div>

  <p class="footnote">המיקום נשמר במכשיר שלך<br><a href="#" onclick="return false;">נוצר ע"י אלכס ליבוביץ</a></p>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'po-hanity-current-spot';
  let pendingPhotoDataUrl = null;
  let deferredInstallPrompt = null;

  const formCard = document.getElementById('formCard');
  const savedCard = document.getElementById('savedCard');
  const spotInput = document.getElementById('spotInput');
  const levelInput = document.getElementById('levelInput');
  const noteInput = document.getElementById('noteInput');
  const photoInput = document.getElementById('photoInput');
  const photoBtn = document.getElementById('photoBtn');
  const photoPreview = document.getElementById('photoPreview');
  const photoRemove = document.getElementById('photoRemove');
  const saveBtn = document.getElementById('saveBtn');
  const saveBtnLabel = document.getElementById('saveBtnLabel');
  const saveIcon = document.getElementById('saveIcon');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const timeStr = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return `היום, ${timeStr}`;
    const dateStr = d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' });
    return `${dateStr}, ${timeStr}`;
  }

  // --- Local storage helpers (this file runs as a real installed app, so
  // localStorage is used instead of the Claude-artifact storage API) ---
  function saveEntry(entry) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entry));
  }
  function loadEntry() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }
  function clearEntry() {
    localStorage.removeItem(STORAGE_KEY);
  }

  // --- Photo capture with compression ---
  photoBtn.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        pendingPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.7);
        photoPreview.src = pendingPhotoDataUrl;
        photoPreview.style.display = 'block';
        photoBtn.style.display = 'none';
        photoRemove.style.display = 'block';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  photoRemove.addEventListener('click', () => {
    pendingPhotoDataUrl = null;
    photoInput.value = '';
    photoPreview.style.display = 'none';
    photoBtn.style.display = 'flex';
    photoRemove.style.display = 'none';
  });

  // --- Save ---
  saveBtn.addEventListener('click', () => {
    const spot = spotInput.value.trim();
    const level = levelInput.value.trim();
    if (!spot && !level) {
      showToast('הזן לפחות שורה/עמוד או קומה');
      return;
    }
    const entry = {
      spot: spot || '—',
      level: level || '—',
      note: noteInput.value.trim(),
      photo: pendingPhotoDataUrl,
      timestamp: new Date().toISOString()
    };

    try {
      saveEntry(entry);
      renderSaved(entry);
      showToast('המיקום נשמר');
    } catch (err) {
      console.error('Storage error:', err);
      showToast('שגיאה בשמירה, ייתכן שהתמונה כבדה מדי');
    }
  });

  // --- Render saved state ---
  function renderSaved(entry) {
    document.getElementById('savedSpot').textContent = entry.spot;
    document.getElementById('savedLevel').textContent = entry.level;
    document.getElementById('savedTime').textContent = formatTime(entry.timestamp);
    const noteWrap = document.getElementById('savedNoteWrap');
    if (entry.note) {
      document.getElementById('savedNote').textContent = entry.note;
      noteWrap.style.display = 'block';
    } else {
      noteWrap.style.display = 'none';
    }
    const savedPhoto = document.getElementById('savedPhoto');
    if (entry.photo) {
      savedPhoto.src = entry.photo;
      savedPhoto.style.display = 'block';
    } else {
      savedPhoto.style.display = 'none';
    }
    formCard.style.display = 'none';
    savedCard.style.display = 'block';
  }

  function showForm(prefill) {
    formCard.style.display = 'block';
    savedCard.style.display = 'none';
    if (prefill) {
      spotInput.value = prefill.spot === '—' ? '' : prefill.spot;
      levelInput.value = prefill.level === '—' ? '' : prefill.level;
      noteInput.value = prefill.note || '';
      if (prefill.photo) {
        pendingPhotoDataUrl = prefill.photo;
        photoPreview.src = prefill.photo;
        photoPreview.style.display = 'block';
        photoBtn.style.display = 'none';
        photoRemove.style.display = 'block';
      }
    }
  }

  document.getElementById('editBtn').addEventListener('click', () => {
    showForm(loadEntry());
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    clearEntry();
    spotInput.value = '';
    levelInput.value = '';
    noteInput.value = '';
    photoInput.value = '';
    pendingPhotoDataUrl = null;
    photoPreview.style.display = 'none';
    photoBtn.style.display = 'flex';
    photoRemove.style.display = 'none';
    formCard.style.display = 'block';
    savedCard.style.display = 'none';
    showToast('בהצלחה עם המשך היום!');
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const entry = loadEntry();
    if (!entry) {
      showToast('אין עדיין מיקום שמור לשיתוף');
      return;
    }
    const text = `חניתי ב${entry.spot !== '—' ? 'שורה/עמוד ' + entry.spot : ''} ${entry.level !== '—' ? 'קומה ' + entry.level : ''}${entry.note ? ' — ' + entry.note : ''}`.trim();
    if (navigator.share) {
      try {
        await navigator.share({ title: 'איפה חניתי', text });
      } catch (err) { /* user cancelled */ }
    } else {
      try {
        await navigator.clipboard.writeText(text);
        showToast('הועתק ללוח');
      } catch (err) {
        showToast('לא ניתן לשתף במכשיר זה');
      }
    }
  });

  // --- Load existing spot on start ---
  const existing = loadEntry();
  if (existing) renderSaved(existing);

  // --- PWA install prompt ---
  const installBanner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBanner.style.display = 'flex';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBanner.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBanner.style.display = 'none';
  });

  // --- Register service worker for offline support ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
